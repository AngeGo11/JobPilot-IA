<!DOCTYPE html>
<html lang="fr" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="x-apple-disable-message-reformatting">
    <title>JobPilot-AI</title>
    <!--[if mso]>
    <noscript>
        <xml>
            <o:OfficeDocumentSettings>
                <o:PixelsPerInch>96</o:PixelsPerInch>
            </o:OfficeDocumentSettings>
        </xml>
    </noscript>
    <![endif]-->
</head>
<body style="margin:0; padding:0; background-color:#F1F5F9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color:#F1F5F9;">
        <tr>
            <td align="center" style="padding: 24px 16px;">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="max-width: 600px;">
                    <!-- Header : Logo jobpilot-ai -->
                    <tr>
                        <td style="background-color:#FFFFFF; padding: 24px 24px 20px 24px; text-align: center; border: 1px solid #E2E8F0; border-bottom: none; border-radius: 12px 12px 0 0; -webkit-border-radius: 12px 12px 0 0;">
                            <a href="#" style="text-decoration: none; font-size: 22px; font-weight: 700; color: #4F46E5;">JobPilot-AI</a>
                        </td>
                    </tr>
                    <!-- Body : conteneur central -->
                    <tr>
                        <td style="background-color:#FFFFFF; padding: 0 24px 24px 24px; border-left: 1px solid #E2E8F0; border-right: 1px solid #E2E8F0; border-bottom: 1px solid #E2E8F0; border-radius: 0 0 12px 12px; -webkit-border-radius: 0 0 12px 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.08);">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>
                    <!-- Footer -->
                    <tr>
                        <td align="center" style="padding: 20px 24px 0 24px;">
                            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="max-width: 600px;">
                                <tr>
                                    <td style="font-size: 12px; color: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; line-height: 1.5;">
                                        &copy; 2026 JobPilot-AI. Tous droits r&eacute;serv&eacute;s.
                                    </td>
                                </tr>
                                <tr>
                                    <td style="padding-top: 8px; font-size: 11px;">
                                        <a href="#" style="color: #94A3B8; text-decoration: underline;">Pr&eacute;f&eacute;rences</a>
                                        <span style="color: #94A3B8;"> &middot; </span>
                                        <a href="#" style="color: #94A3B8; text-decoration: underline;">Se d&eacute;sinscrire</a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
