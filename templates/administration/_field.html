{# Rendu d'un champ de formulaire du back-office (cases à cocher mises en avant). #}
{% if field.field.widget.input_type == 'checkbox' %}
<label class="flex items-start gap-3 p-3 rounded-lg border border-slate-200 hover:bg-slate-50 transition-colors cursor-pointer">
    <div class="pt-0.5">{{ field }}</div>
    <div>
        <span class="block text-sm font-semibold text-slate-800">{{ field.label }}</span>
        {% if field.help_text %}<span class="block text-xs text-slate-500 mt-0.5">{{ field.help_text }}</span>{% endif %}
        {% for error in field.errors %}<span class="block text-xs text-red-600 mt-1">{{ error }}</span>{% endfor %}
    </div>
</label>
{% else %}
<div>
    <label for="{{ field.id_for_label }}" class="block text-xs font-medium uppercase tracking-wide text-slate-500 mb-1.5">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<p class="text-xs text-slate-500 mt-1.5">{{ field.help_text }}</p>{% endif %}
    {% for error in field.errors %}<p class="text-xs text-red-600 mt-1.5">{{ error }}</p>{% endfor %}
</div>
{% endif %}
