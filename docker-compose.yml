
services:
  # --- Service 1 : La Base de Données PostgreSQL ---
  db:
    # Image officielle pgvector, construite sur postgres:15 : le répertoire de
    # données reste compatible, l'extension « vector » devient disponible.
    # Elle est nécessaire au matching sémantique (embeddings de CV et d'offres).
    image: pgvector/pgvector:pg15
    container_name: jobpilot_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      # On utilise les valeurs par défaut ou celles du .env
      - POSTGRES_DB=${DB_NAME:-jobpilot_db}
      - POSTGRES_USER=${DB_USER:-axel}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password123}
    ports:
      # Port hôte configurable : 5433 par défaut, surchargeable via DB_PORT_HOST
      # quand ce port est déjà pris par un autre projet.
      - "${DB_PORT_HOST:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axel -d jobpilot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Service 2 : Redis (Pour Celery / Cache) ---
  redis:
    image: redis:7-alpine
    container_name: jobpilot_redis
    restart: always
    ports:
      - "6379:6379"

  # --- Service 3 : Interface Adminer (Bonus) ---
  # Accessible sur http://localhost:8080 pour voir ta BDD
  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db

  # --- Service 4 : Worker Celery (traitements IA) ---
  # Exécute les appels Gemini et France Travail hors du cycle requête/réponse.
  # Sans lui, une génération de lettre immobilise un worker web pendant toute
  # sa durée. Profil « workers » pour ne pas l'imposer à un simple `docker compose up`.
  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: celery -A JobPilot worker --loglevel=info --concurrency=2
    restart: unless-stopped
    profiles: ["workers"]
    environment:
      - DATABASE_URL=postgres://${DB_USER:-axel}:${DB_PASSWORD:-password123}@db:5432/${DB_NAME:-jobpilot_db}
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # --- Service 5 : Planificateur Celery ---
  # Remplace le cron à configurer à la main sur l'hébergeur : la planification
  # est versionnée dans JobPilot/celery.py.
  beat:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: celery -A JobPilot beat --loglevel=info
    restart: unless-stopped
    profiles: ["workers"]
    environment:
      - DATABASE_URL=postgres://${DB_USER:-axel}:${DB_PASSWORD:-password123}@db:5432/${DB_NAME:-jobpilot_db}
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
      - worker

volumes:
  postgres_data:
